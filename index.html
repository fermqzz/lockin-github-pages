<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LockIn</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LockIn">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232322;
    --surface-3:#2c2c2a;
    --border:#2c2c2a;
    --border-soft:#232322;
    --text:#f4f5f2;
    --text-muted:#c3c2b7;
    --text-dim:#898781;
    --accent:#c6ff3d;
    --accent-strong:#e2ff8f;
    --accent-ink:#0c1000;
    --accent-soft:rgba(198,255,61,0.13);
    --accent-soft-2:rgba(198,255,61,0.06);
    --danger:#e66767;
    --danger-soft:rgba(230,103,103,0.13);
    --radius-sm:6px;
    --radius:12px;
    --radius-lg:18px;
    --glow:0 0 26px rgba(198,255,61,0.16);
    --font-display:'Big Shoulders',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    color-scheme:dark;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;touch-action:pan-y pan-x;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 1000px 640px at 12% -12%, rgba(198,255,61,0.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 42px),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);}
  h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;color:var(--text);}
  ::selection{background:var(--accent-soft);color:var(--text);}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: no-preference){
    .nav-btn.active .nav-dot{animation:pulse 2.2s ease-in-out infinite;}
  }
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(198,255,61,0.5);}50%{opacity:.75;box-shadow:0 0 0 5px rgba(198,255,61,0);}}

  /* ---------- layout (app shell: the bottom bar is a flex sibling, never inside
     the scrolling region — this is what keeps it truly pinned, not position:fixed) ---------- */
  html,body{overflow:hidden;}
  .app{display:flex;height:100vh;height:100dvh;}
  .sidebar{
    width:238px;flex-shrink:0;border-right:1px solid var(--border);
    padding:26px 18px;display:flex;flex-direction:column;gap:26px;
    overflow-y:auto;background:rgba(10,10,10,0.35);
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand-mark{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:0.5px;color:var(--text);text-shadow:0 0 22px rgba(198,255,61,0.25);}
  .brand-mark span{color:var(--accent);}
  .brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase;}

  .nav-main{display:flex;flex-direction:column;gap:4px;}
  .nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:none;color:var(--text-muted);font-family:var(--font-display);
    font-size:19px;font-weight:700;letter-spacing:0.3px;padding:10px 10px;border-radius:var(--radius-sm);cursor:pointer;
  }
  .nav-btn:hover{background:var(--surface);color:var(--text);}
  .nav-btn.active{color:var(--accent);background:var(--surface);}
  .nav-icon{width:20px;height:20px;flex-shrink:0;stroke:currentColor;}
  .nav-btn.active .nav-icon{filter:drop-shadow(0 0 5px rgba(198,255,61,0.55));}
  .nav-sub{display:none;flex-direction:column;gap:2px;margin:2px 0 10px 22px;}
  .nav-sub.open{display:flex;}
  .nav-sub button{
    background:none;border:none;text-align:left;color:var(--text-dim);font-family:var(--font-mono);
    font-size:12px;letter-spacing:0.03em;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;
  }
  .nav-sub button:hover{color:var(--text);background:var(--surface-2);}
  .nav-sub button.active{color:var(--accent);background:var(--accent-soft-2);}

  .sidebar-foot{margin-top:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);line-height:1.6;border-top:1px solid var(--border);padding-top:14px;}
  .sidebar-foot b{color:var(--text-muted);}

  .main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden;}
  .app-topbar{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden;}
  .app-topbar::before{content:'';position:absolute;top:-40%;left:-20%;width:70%;height:140%;background:radial-gradient(circle, rgba(198,255,61,0.10), transparent 70%);pointer-events:none;}
  .app-topbar .mark{position:relative;font-family:var(--font-display);font-weight:800;letter-spacing:0.5px;font-size:44px;line-height:1;color:var(--text);}
  .app-topbar .mark span{color:var(--accent);}
  .sync-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:var(--surface-2);
    border:1px solid var(--border);color:var(--text-dim);width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;z-index:1;}
  .sync-btn:hover{color:var(--text);border-color:var(--text-dim);}
  .sync-btn.is-synced{color:var(--accent);border-color:var(--accent-soft);}
  .sync-btn.is-syncing{color:var(--text-muted);}
  .sync-btn.is-error{color:var(--danger);border-color:var(--danger-soft);}
  .summary-strip{display:flex;align-items:stretch;border-bottom:1px solid var(--border);padding:0 10px;flex-shrink:0;overflow-x:auto;}
  .strip-item{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;white-space:nowrap;}
  .strip-div{width:1px;background:var(--border);flex-shrink:0;margin:8px 0;}
  .strip-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-dim);}
  .strip-value{font-family:var(--font-mono);font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;}
  .up{color:var(--accent);} .down{color:var(--danger);}

  .main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 32px 60px;}
  .view-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .view-head h1{font-size:32px;}
  .view-head h1 span{color:var(--accent);}

  /* ---------- generic components ---------- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:22px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel h2{font-size:18px;font-weight:700;letter-spacing:0.2px;margin-bottom:14px;color:var(--text);}
  .panel h2.tight{margin-bottom:6px;}
  .hint{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin:-8px 0 14px;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:end;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted);}
  .field-wide{grid-column:span 2;}
  .field span{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);}
  input,select,textarea{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);font-family:var(--font-body);font-size:13.5px;padding:9px 10px;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input[type="color"]{padding:3px;height:36px;width:52px;cursor:pointer;}
  input[type="checkbox"]{width:auto;accent-color:var(--accent);}
  input[type="file"]{padding:6px 8px;font-size:12px;}
  textarea{resize:vertical;min-height:60px;}
  .field-actions{display:flex;gap:10px;grid-column:1/-1;}

  .btn{
    font-family:var(--font-mono);font-size:12.5px;font-weight:500;letter-spacing:0.02em;
    padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--danger);border-color:var(--danger-soft);background:transparent;}
  .btn-danger:hover{background:var(--danger-soft);border-color:var(--danger);}
  .btn-sm{padding:7px 12px;font-size:11.5px;}
  .btn-icon{padding:5px 9px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:13px;}
  .btn-icon:hover{color:var(--text);background:var(--surface-2);border-color:var(--border);}

  .seg-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;}
  .seg-btn{background:none;border:none;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;padding:6px 14px;border-radius:999px;cursor:pointer;}
  .seg-btn.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}

  .chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--text-muted);}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor;}
  .chip-action{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:3px 5px;border-radius:5px;line-height:1;}
  .chip-action:hover{color:var(--text);background:var(--surface-3);}
  .type-form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .type-form-row input[type="text"]{width:auto;flex:1;min-width:140px;}
  .editing-banner{font-family:var(--font-mono);font-size:11px;color:var(--accent);margin-bottom:10px;}

  .empty-state{padding:36px 20px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:12.5px;border:1px dashed var(--border);border-radius:var(--radius);}

  .week-group{margin-bottom:18px;}
  .week-head{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .week-head h3{font-size:15px;color:var(--text-muted);font-weight:600;}
  .week-totals{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .table-wrap{overflow-x:auto;}
  .entry-row{
    display:grid;grid-template-columns:10px 78px 130px 66px 66px 1fr 60px;gap:10px;align-items:center;
    padding:9px 6px;border-bottom:1px solid var(--border-soft);font-size:13px;min-width:640px;
  }
  .entry-row .entry-notes{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry-row .entry-metric{font-family:var(--font-mono);color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .entry-actions{display:flex;gap:2px;justify-content:flex-end;}

  .day-entry-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--border);margin-bottom:10px;}
  .day-entry-card .dot{width:14px;height:14px;flex-shrink:0;}
  .day-entry-card-body{flex:1;min-width:0;}
  .day-entry-card-type{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);}
  .day-entry-card-name{font-size:17px;font-weight:600;color:var(--text);margin-top:2px;overflow-wrap:break-word;}
  .day-entry-card-actions{display:flex;gap:2px;flex-shrink:0;}
  .day-add-entry-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:16px;border:1px dashed var(--border);border-radius:var(--radius);background:transparent;
    color:var(--accent);font-family:var(--font-display);font-size:17px;font-weight:700;cursor:pointer;margin-top:6px;}
  .day-add-entry-btn:hover{border-color:var(--accent);background:var(--accent-soft-2);}

  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text-muted);}
  td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);}
  tr:last-child td{border-bottom:none;}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .type-filter-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:12px;color:var(--text-muted);}
  .type-filter-chip input{width:auto;margin:0;}
  .type-filter-chip.on{border-color:var(--tint,var(--accent));background:var(--tint-soft,var(--accent-soft));color:var(--text);}

  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;position:relative;}
  .chart-card svg{width:100%;height:auto;display:block;overflow:visible;}
  .chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);}
  .chart-tooltip{
    position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:8px 11px;font-family:var(--font-mono);font-size:11.5px;color:var(--text);
    box-shadow:0 10px 28px rgba(0,0,0,0.55);white-space:nowrap;z-index:10;opacity:0;transition:opacity .1s;
  }
  .chart-tooltip.show{opacity:1;}
  .chart-tooltip .tt-row{display:flex;align-items:center;gap:6px;}
  .chart-tooltip .tt-dot{width:7px;height:7px;border-radius:50%;}

  .meal-block{border:1px dashed var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);}
  .meal-block-head{display:flex;gap:12px;align-items:flex-start;}
  .meal-photo{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:var(--surface-3);flex-shrink:0;}
  .meal-photo-empty{width:56px;height:56px;border-radius:8px;border:1px dashed var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:18px;}
  .dish-thumb{width:20px;height:20px;border-radius:5px;object-fit:cover;flex-shrink:0;}

  .ingredient-row-form{display:grid;grid-template-columns:1.4fr 64px 58px 40px;gap:8px;align-items:center;margin-bottom:8px;}
  .ingredient-row-form-add{grid-template-columns:1.4fr 64px 58px auto;}
  .ing-remove{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;}
  .ing-remove:hover{color:var(--danger);}
  .dish-totals-preview{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin:8px 0 14px;padding:10px 14px;background:var(--accent-soft-2);border-radius:var(--radius-sm);border:1px solid var(--border);}

  .diet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px;}
  .diet-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;}
  .diet-card.is-active{border-color:var(--accent);box-shadow:var(--glow);}
  .diet-card h3{font-size:17px;}
  .diet-active-badge{font-family:var(--font-mono);font-size:10px;color:var(--accent-ink);background:var(--accent);padding:2px 9px;border-radius:999px;letter-spacing:0.06em;text-transform:uppercase;width:fit-content;}
  .diet-macro-row{display:flex;gap:12px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}
  .diet-card-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .diet-card-photos{display:flex;gap:5px;margin:2px 0 2px;}
  .diet-card-photo{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
  .diet-card-photo-empty{width:38px;height:38px;border-radius:8px;background:var(--surface-3);border:1px dashed var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim);}
  .diet-card-photo-more{width:38px;height:38px;border-radius:8px;background:var(--surface-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);}

  .menu-tabs-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;}
  .menu-tabs{display:flex;gap:8px;padding-bottom:2px;}
  .menu-tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:12px;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .menu-tab:hover{border-color:var(--text-dim);color:var(--text);}
  .menu-tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .menu-tab-add{color:var(--accent);border-style:dashed;}
  .menu-tab-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;color:var(--accent-ink);opacity:0.65;font-size:13px;line-height:1;cursor:pointer;}
  .menu-tab-x:hover{opacity:1;background:rgba(12,16,0,0.18);}
  .menu-head-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .menu-head-row .field{flex:1;min-width:160px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);
    border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:999px;
    font-family:var(--font-mono);font-size:12.5px;z-index:100;box-shadow:var(--glow);}
  @media (max-width:880px){ .toast{ bottom:calc(88px + env(safe-area-inset-bottom)); } }

  /* ---------- back link (drill-down screens) ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-dim);
    font-family:var(--font-mono);font-size:12px;cursor:pointer;padding:6px 4px;margin-bottom:14px;}
  .back-link:hover{color:var(--accent);}

  /* ---------- diets: home list ---------- */
  .diets-create-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:22px;border:1px dashed var(--border);border-radius:var(--radius-lg);background:var(--surface);
    color:var(--accent);font-family:var(--font-display);font-size:18px;font-weight:700;cursor:pointer;margin-bottom:18px;}
  .diets-create-btn:hover{border-color:var(--accent);background:var(--accent-soft-2);}
  .diet-card{cursor:pointer;}
  .diet-card:hover{border-color:var(--text-dim);}
  .diet-card-actions{cursor:default;}

  /* ---------- diet editor: meal dish management ---------- */
  .assigned-dishes{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0;}
  .assigned-dish-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:5px 6px 5px 12px;font-size:12px;color:var(--text-muted);}
  .assigned-dish-chip b{color:var(--text);font-weight:500;}
  .subtle-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px;margin-top:10px;}

  /* ---------- diet view (read-only, visual) ---------- */
  .diet-view-menu-title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);margin-bottom:16px;}
  .meal-view-block{margin-bottom:24px;}
  .meal-view-block:last-child{margin-bottom:0;}
  .meal-view-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border-soft);}
  .dish-view-grid{display:flex;flex-direction:column;gap:10px;}
  .dish-view-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:row;align-items:stretch;}
  .dish-view-photo{width:60px;height:60px;object-fit:cover;background:var(--surface-3);display:block;flex-shrink:0;}
  .dish-view-photo-empty{width:60px;height:60px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-dim);flex-shrink:0;}
  .dish-view-body{padding:8px 12px;display:flex;flex-direction:column;gap:4px;flex:1;justify-content:center;min-width:0;}
  .dish-view-name{font-weight:700;color:var(--text);font-size:13.5px;line-height:1.3;}
  .dish-view-ings{display:flex;flex-direction:column;gap:2px;}
  .dish-view-ing-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-muted);}
  .dish-view-ing-qty{font-family:var(--font-mono);color:var(--text-dim);flex-shrink:0;white-space:nowrap;}
  .dish-view-card-loose .dish-view-body{padding:10px 12px;}
  .dish-view-card-loose .dish-view-ing-row{font-size:13px;color:var(--text-muted);}

  /* ---------- training: calendar ---------- */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-title{font-family:var(--font-display);font-size:20px;font-weight:700;}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);border-radius:8px;
    width:32px;height:32px;font-size:15px;cursor:pointer;}
  .cal-nav button:hover{color:var(--accent);border-color:var(--accent);}
  .cal-summary{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-bottom:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);text-align:center;padding-bottom:4px;}
  .cal-cell{min-height:76px;border:1px solid var(--border-soft);border-radius:8px;padding:6px;background:var(--surface-2);
    cursor:pointer;display:flex;flex-direction:column;gap:4px;}
  .cal-cell:hover{border-color:var(--text-dim);}
  .cal-cell.out{opacity:0.3;}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.selected{background:var(--accent-soft-2);border-color:var(--accent);}
  .cal-daynum{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .cal-cell.today .cal-daynum{color:var(--accent);font-weight:600;}
  .cal-dots{display:flex;flex-wrap:wrap;gap:3px;}
  .cal-dots .dot{width:7px;height:7px;box-shadow:none;}
  .cal-more{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);}
  .type-month-breakdown{display:flex;flex-direction:column;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);}
  .type-month-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);}
  .type-month-name{flex:1;}
  .type-month-count{font-family:var(--font-mono);color:var(--text-dim);font-variant-numeric:tabular-nums;}
  @media (max-width:640px){
    .cal-cell{min-height:52px;padding:4px;}
    .cal-dow{font-size:9px;}
  }

  /* ---------- day detail modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,6,5,0.72);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;
  }
  .modal-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:22px 24px;max-width:560px;width:100%;max-height:min(80vh,700px);overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,0.5);position:relative;
  }
  .modal-close{
    position:absolute;top:14px;right:14px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text-dim);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .modal-close:hover{color:var(--text);border-color:var(--text-dim);}
  .modal-box h2{padding-right:8px;}
  .modal-box .view-head{padding-right:34px;}

  .content-subnav{display:none;}

  @media (max-width:880px){
    .app{flex-direction:column;}
    .main-wrap{order:1;flex:1;min-height:0;}
    .sidebar{
      order:2;flex-shrink:0;width:auto;height:auto;overflow-y:visible;
      flex-direction:row;
      margin:0 max(10px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      padding:6px 10px;
      gap:0;border:1px solid var(--border);border-radius:var(--radius-lg);
      background:rgba(15,16,14,0.92);backdrop-filter:blur(6px);
      box-shadow:0 10px 28px rgba(0,0,0,0.4);
    }
    .brand{display:none;}
    .sidebar-foot{display:none;}
    .nav-main{flex-direction:row;width:100%;justify-content:space-around;gap:8px;max-width:420px;margin:0 auto;}
    .nav-sub{display:none !important;}
    .nav-btn{flex-direction:column;gap:4px;font-size:11.5px;padding:7px 10px;flex:1;text-align:center;align-items:center;border-radius:10px;}
    .nav-icon{width:22px;height:22px;}
    .main{padding:20px 16px 32px;}
    .field-wide{grid-column:span 1;}
    .content-subnav{display:inline-flex;margin-bottom:16px;}
    /* iOS Safari auto-zooms into any text field whose font-size is under 16px,
       and can get stuck zoomed in afterwards — keeping fields at 16px+ here
       stops that zoom from triggering in the first place. */
    input,select,textarea{font-size:16px;}
  }

     whenever this file was last generated/committed (e.g. on GitHub Pages,
     where there is no artifact-publish step to keep it fresh), so trusting it
     first was silently reverting local edits every time the page loaded. */
  try {
    var ls = localStorage.getItem(LS_KEY);
    if (ls) state = JSON.parse(ls);
  } catch(e){}
  if (!state){
    try {
      var embedded = JSON.parse(stateScriptEl.textContent || '{}');
      if (embedded && embedded.training && embedded.nutrition) state = embedded;
    } catch(e){}
  }
  if (!state) state = defaultState();
  /* Migrate the old combined weight+goal+calories log into three independent
     series — each is now updated on its own, without re-entering the others. */
  if (!state.nutrition.weightLogs){
    var oldLogs = state.nutrition.logs || [];
    state.nutrition.weightLogs = oldLogs.filter(function(l){ return l.weight!=null; }).map(function(l){ return {id:uid(), date:l.date, weight:l.weight}; });
    state.nutrition.goalLogs = oldLogs.filter(function(l){ return l.goalId; }).map(function(l){ return {id:uid(), date:l.date, goalId:l.goalId}; });
    state.nutrition.calorieLogs = oldLogs.filter(function(l){ return l.targetCalories!=null; }).map(function(l){ return {id:uid(), date:l.date, targetCalories:l.targetCalories}; });
    delete state.nutrition.logs;
  }
  ensureFixedGoals(state);
  (state.training.entries||[]).forEach(function(e){ if (e.name==null) e.name = e.notes || ''; });
  (state.nutrition.dishes||[]).forEach(function(d){
    (d.items||[]).forEach(function(it){
      if (it.quantity==null){ it.quantity = it.grams!=null ? it.grams : 100; it.unit = 'g'; delete it.grams; }
    });
  });
  (state.nutrition.diets||[]).forEach(function(d){
    if (!d.menus){ d.menus = [{id: uid(), name:'Menú 1', meals: d.meals || []}]; delete d.meals; }
  });

  var INITIAL_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;
  function buildDoc(newState){
    try{
      var doc = new DOMParser().parseFromString(INITIAL_HTML, 'text/html');
      var s = doc.getElementById('app-state');
      s.textContent = JSON.stringify(newState);
      return '<!doctype html>\n' + doc.documentElement.outerHTML;
    } catch(e){ return null; }
  }

  var artifactApi = null;
  (function initArtifact(){
    try{
      if (window.claude && window.claude.use){
        window.claude.use('artifact').then(function(a){ artifactApi = a; }).catch(function(){});
      }
    } catch(e){}
  })();

  var saveTimer = null;
  function persist(){
    /* Saving republishes the artifact, which reloads the page — capture exactly
       where the user was scrolled to (before the re-render can shift it) so it
       can be restored once the reload comes back, instead of snapping to top. */
    var mainElNow = document.getElementById('main');
    if (mainElNow) ui.mainScrollTop = mainElNow.scrollTop;
    render();
    state._ui = { route: route, ui: ui, dishBuilder: dishBuilder, dietBuilder: dietBuilder, dietsUI: dietsUI };
    state._updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    scheduleCloudPush();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      if (artifactApi){
        var doc = buildDoc(state);
        if (doc){ artifactApi.publish(doc).catch(function(){}); }
      }
    }, 350);
  }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(t._timer);

  /* ============================= cloud sync (Supabase) =============================
     Centralized backup so data survives a device's local storage being wiped
     (e.g. deleting and re-adding the iOS home-screen icon, which starts with a
     brand-new empty localStorage). Identified by a PIN the user picks — no
     account/login system, just a shared key across their own devices.

     Conflict rule: each save stamps state._updatedAt (Date.now()). Whichever
     copy — local or cloud — has the higher timestamp wins on connect, EXCEPT a
     local copy that has never been saved before (_updatedAt still unset) always
     loses to an existing cloud copy — that's what makes recovering onto a fresh
     device/reinstall pull the real data instead of overwriting it with empty. */
  var SUPABASE_URL = 'https://unyjmewnhoiauqinplmo.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVueWptZXduaG9pYXVxaW5wbG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MjQ2MTAsImV4cCI6MjEwNDIwMDYxMH0.deLdAJHr43ctixGYXnJVnvYJcv0eNIAcicQlDvnmfI8';
  var LS_PIN_KEY = 'lockin-pin-v1';

  var sb = null;
  try {
    if (window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch(e){}

  var syncPin = null;
  try { syncPin = localStorage.getItem(LS_PIN_KEY); } catch(e){}
  var syncStatus = 'offline'; // 'offline' | 'syncing' | 'synced' | 'error'

  function setSyncStatus(s){
    syncStatus = s;
    renderSyncButton();
    if (typeof ui!=='undefined' && ui && ui.showSyncModal) renderSyncModal();
  }

  function cloudPull(pin){
    if (!sb) return Promise.resolve(null);
    return sb.from('app_state').select('data').eq('pin', pin).maybeSingle().then(function(res){
      if (res.error) throw res.error;
      return res.data ? res.data.data : null;
    });
  }

  function cloudPush(pin, st){
    if (!sb) return Promise.resolve();
    return sb.from('app_state').upsert({ pin: pin, data: st, updated_at: new Date().toISOString() }, { onConflict: 'pin' }).then(function(res){
      if (res.error) throw res.error;
    });
  }

  var pushTimer = null;
  function scheduleCloudPush(){
    if (!sb || !syncPin) return;
    setSyncStatus('syncing');
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){
      cloudPush(syncPin, state).then(function(){ setSyncStatus('synced'); }).catch(function(){ setSyncStatus('error'); });
    }, 600);
  }

  function connectPin(pin){
    pin = (pin||'').trim();
    if (!pin || !sb) return;
    try { localStorage.setItem(LS_PIN_KEY, pin); } catch(e){}
    syncPin = pin;
    setSyncStatus('syncing');
    cloudPull(pin).then(function(cloudData){
      var cloudUpdatedAt = (cloudData && cloudData._updatedAt) || 0;
      var localUpdatedAt = state._updatedAt || 0;
      if (cloudData && (localUpdatedAt===0 || cloudUpdatedAt>localUpdatedAt)){
        state = cloudData;
        ensureFixedGoals(state);
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
        renderAll();
        toast('Datos recuperados de la nube');
        setSyncStatus('synced');
      } else {
        return cloudPush(pin, state).then(function(){ setSyncStatus('synced'); toast('Sincronizado'); });
      }
    }).catch(function(){ setSyncStatus('error'); toast('No se pudo sincronizar — revisa la conexión'); });
  }

  function disconnectPin(){
    try { localStorage.removeItem(LS_PIN_KEY); } catch(e){}
    syncPin = null;
    setSyncStatus('offline');
  }

  function renderSyncButton(){
    var btn = document.getElementById('syncBtn');
    if (!btn) return;
    btn.classList.remove('is-synced','is-syncing','is-error');
    if (!syncPin){ btn.textContent='🔗'; btn.title='Sincronización en la nube: no configurada'; }
    else if (syncStatus==='syncing'){ btn.textContent='↻'; btn.classList.add('is-syncing'); btn.title='Sincronizando…'; }
    else if (syncStatus==='error'){ btn.textContent='⚠'; btn.classList.add('is-error'); btn.title='Error al sincronizar'; }
    else { btn.textContent='☁'; btn.classList.add('is-synced'); btn.title='Sincronizado con la nube'; }
  }

        '<button type="button" class="btn btn-sm btn-danger" data-action="disconnect-pin">Desconectar</button>' +
      '</div>');
    host.innerHTML =
      '<div class="modal-overlay" id="syncModalOverlay">' +
        '<div class="modal-box" style="max-width:420px;">' +
          '<button type="button" class="modal-close" data-action="close-sync-modal">×</button>' +

        '</div>' +

  }

  /* ============================= route & transient ui state ============================= */
  var route = {section:'training'};
  var ui = {
    editingTypeId:null,
    editingEntryId:null,
    editingWeightId:null,
    editingGoalLogId:null,
    editingCalorieLogId:null,

  };

  var dietBuilder = null; // { editingId, name, activeMenuIdx, menus:[{id,name,meals:[{id,name,dishIds:[]}]}] }
  var dietsUI = { screen:'list', dishReturnMealIdx:null, looseFormMealIdx:null, viewDietId:null, viewMenuIdx:0 };       // screen: 'list' | 'diet' | 'dish'; viewDietId shows the diet-view as a popup over 'list'

  function cloneMenus(menus){ return menus.map(function(mn){ return {id:mn.id, name:mn.name, meals: mn.meals.map(function(m){ return {id:m.id, name:m.name, photo:m.photo, dishIds:m.dishIds.slice()}; })}; }); }
  dietBuilder = newDietBuilder();

  /* Deliberately NOT restoring route/ui/dishBuilder/dietBuilder/dietsUI from
     state._ui here: on GitHub Pages every open of the app (tapping the home-
     screen icon, refreshing) is a fresh page load with no in-session reload
     to recover from, so each launch should start clean on the Entreno tab
     like a real app's home screen — only the underlying data persists. */

  /* ============================= computed helpers ============================= */
  function getType(id){ return state.training.types.find(function(t){return t.id===id;}); }
  function getGoal(id){ return state.nutrition.goals.find(function(g){return g.id===id;}); }
  function getIngredient(id){ return state.nutrition.ingredients.find(function(i){return i.id===id;}); }
  function getDish(id){ return state.nutrition.dishes.find(function(d){return d.id===id;}); }

  function fullyDeleteDish(delId){
    state.nutrition.dishes = state.nutrition.dishes.filter(function(x){return x.id!==delId;});
    (dietBuilder.menus||[]).forEach(function(mn){ (mn.meals||[]).forEach(function(m){ var p=m.dishIds.indexOf(delId); if(p>=0) m.dishIds.splice(p,1); }); });
    state.nutrition.diets.forEach(function(diet){ diet.menus.forEach(function(mn){ mn.meals.forEach(function(m){ var p=m.dishIds.indexOf(delId); if(p>=0) m.dishIds.splice(p,1); }); }); });
  }

  function latestByDate(arr){
    if (!arr || !arr.length) return null;
    var sorted = arr.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
    return sorted[sorted.length-1];
  }

  function computeSummary(){
    var weightsSorted = state.nutrition.weightLogs.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
    var lastWeight = weightsSorted[weightsSorted.length-1] || null;
    var prevWeight = weightsSorted[weightsSorted.length-2] || null;
    var weightDelta = (lastWeight && prevWeight) ? round1(lastWeight.weight - prevWeight.weight) : null;
    var lastGoalEntry = latestByDate(state.nutrition.goalLogs);
    var activeGoal = lastGoalEntry ? getGoal(lastGoalEntry.goalId) : null;
    var lastCalEntry = latestByDate(state.nutrition.calorieLogs);
    var activeCalories = lastCalEntry ? lastCalEntry.targetCalories : null;

    return {lastWeight:lastWeight, weightDelta:weightDelta, activeGoal:activeGoal, activeCalories:activeCalories};
  }

  function renderSummaryBar(){
    var sum = computeSummary();
    var deltaHtml = '';
    if (sum.weightDelta!=null && sum.weightDelta!==0){
      var cls = sum.weightDelta>0?'up':'down';
      var arrow = sum.weightDelta>0?'▲':'▼';
      deltaHtml = ' <span class="'+cls+'">'+arrow+Math.abs(sum.weightDelta).toFixed(1)+'</span>';
    }
    var items = [
      {label:'Peso', value:(sum.lastWeight?sum.lastWeight.weight.toFixed(1)+' kg':'—')+deltaHtml},
      {label:'Objetivo', value: sum.activeGoal? '<span class="dot" style="background:'+sum.activeGoal.color+';color:'+sum.activeGoal.color+'"></span>'+esc(sum.activeGoal.name) : '—'},
      {label:'Kcal objetivo', value: sum.activeCalories!=null ? sum.activeCalories : '—'}

  function buildCalendarHtml(types){
    var ym = ui.trainingCalMonth;
    var byDate = {};
    state.training.entries.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });

    var monthEntries = state.training.entries.filter(function(e){ return monthKeyOf(e.date)===ym; });

    var p = ym.split('-').map(Number);
    var firstOfMonth = new Date(p[0],p[1]-1,1);
    var startOffset = (firstOfMonth.getDay()+6)%7; // Monday=0
    var gridStart = addDays(firstOfMonth, -startOffset);
    var todayIso = todayStr();

    var dow = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    var cellsHtml = dow.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');

    for (var i=0;i<42;i++){
      var d = addDays(gridStart, i);
      var iso = isoOf(d);
      var inMonth = monthKeyOf(iso)===ym;
      if (i>=35 && !inMonth) continue; // trim trailing row if it's all next-month
      var dayEntries = byDate[iso] || [];
      var shown = dayEntries.slice(0,4);
      var dots = shown.map(function(e){ var t=getType(e.typeId); var c=t?t.color:'#666'; return '<span class="dot" style="background:'+c+';color:'+c+'" title="'+esc(t?t.name:'')+'"></span>'; }).join('');
      var more = dayEntries.length>4 ? '<span class="cal-more">+'+(dayEntries.length-4)+'</span>' : '';
      var cls = 'cal-cell' + (inMonth?'':' out') + (iso===todayIso?' today':'') + (iso===ui.trainingSelectedDate?' selected':'');
      cellsHtml += '<div class="'+cls+'" data-action="cal-select-day" data-date="'+iso+'">' +
        '<span class="cal-daynum">'+d.getDate()+'</span>' +
        '<div class="cal-dots">'+dots+more+'</div>' +
      '</div>';
    }

    var typeCounts = {};
    monthEntries.forEach(function(e){ typeCounts[e.typeId] = (typeCounts[e.typeId]||0) + 1; });
    var breakdownHtml = types.length ? '<div class="type-month-breakdown">' + types.map(function(t){
      var n = typeCounts[t.id] || 0;
      return '<div class="type-month-row"><span class="dot" style="background:'+t.color+';color:'+t.color+'"></span>' +
        '<span class="type-month-name">'+esc(t.name)+'</span>' +
        '<span class="type-month-count">'+n+(n===1?' entreno':' entrenos')+'</span></div>';
    }).join('') + '</div>' : '';

    var html =
      '<div class="cal-header">' +
        '<div class="cal-title">'+monthLabel(ym)+'</div>' +
        '<div class="cal-nav">' +
          '<button type="button" data-action="cal-prev-month">‹</button>' +
          '<button type="button" data-action="cal-next-month">›</button>' +
        '</div>' +
      '</div>' +
      '<div class="cal-summary">'+monthEntries.length+' entreno(s) este mes — toca un día para ver el detalle</div>' +
      '<div class="cal-grid">'+cellsHtml+'</div>' +
      breakdownHtml;

    return html;
  }

  function goalIdAtDate(goalLogsSorted, dateStr){
    var result = null;
    for (var i=0;i<goalLogsSorted.length;i++){
      if (goalLogsSorted[i].date <= dateStr) result = goalLogsSorted[i].goalId; else break;
    }
    return result;
  }

  function buildWeightChart(weightLogs, goalLogs){
    var sorted = weightLogs.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var goalLogsSorted = (goalLogs||[]).slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var resolvedGoalId = sorted.map(function(l){ return goalIdAtDate(goalLogsSorted, l.date); });
    var W=760,H=360, padL=48,padR=16,padT=34,padB=36;
    var plotW=W-padL-padR, plotH=H-padT-padB;

    var t0 = parseDate(sorted[0].date).getTime();
    var t1 = parseDate(sorted[sorted.length-1].date).getTime();
    if (t1===t0) t1 = t0 + 86400000;
    function xOf(dateStr){ var t=parseDate(dateStr).getTime(); return padL + (t-t0)/(t1-t0)*plotW; }

    var weights = sorted.map(function(l){return l.weight;});
    var minW = Math.min.apply(null,weights), maxW = Math.max.apply(null,weights);
    var pad = Math.max((maxW-minW)*0.2, 1);
    minW -= pad; maxW += pad;
    function yOf(w){ return padT + plotH - (w-minW)/(maxW-minW)*plotH; }

    var svgns='http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgns,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);

    // goal bands
    var bands = [];
    var runStart = 0;
    for (var i=1;i<=sorted.length;i++){
      if (i===sorted.length || resolvedGoalId[i]!==resolvedGoalId[runStart]){
        bands.push({from:sorted[runStart].date, to:sorted[i-1].date, goalId:resolvedGoalId[runStart], extendRight: i<sorted.length});
        runStart = i;
      }
    }
    var usedGoals = {};
    bands.forEach(function(b,bi){
      var g = getGoal(b.goalId);
      var color = g?g.color:'#666';
      var xFrom = xOf(b.from);
      var xTo = bi<bands.length-1 ? xOf(bands[bi+1].from) : xOf(b.to)+ (bands.length>1? (xOf(b.to)-xOf(b.from))*0.02 : plotW - (xOf(b.to)-padL));
      if (bands.length===1) xTo = padL+plotW;
      var rect = document.createElementNS(svgns,'rect');
      rect.setAttribute('x',xFrom); rect.setAttribute('y',padT);
      rect.setAttribute('width',Math.max(xTo-xFrom,1)); rect.setAttribute('height',plotH);
      rect.setAttribute('fill',color); rect.setAttribute('opacity','0.13');
      svg.appendChild(rect);
      if (g && !usedGoals[g.id]){
        usedGoals[g.id]=true;
        var label = document.createElementNS(svgns,'text');
        label.setAttribute('x', (xFrom+xTo)/2); label.setAttribute('y', padT-12);
        label.setAttribute('text-anchor','middle'); label.setAttribute('font-family','var(--font-mono)');
        label.setAttribute('font-size','10.5'); label.setAttribute('fill',color); label.setAttribute('letter-spacing','0.04em');
        label.textContent = g.name.toUpperCase();
        svg.appendChild(label);
      }
    });

    // gridlines
    var steps=4;
    for (var s=0;s<=steps;s++){
      var y = padT + plotH - plotH*s/steps;
      var val = minW + (maxW-minW)*s/steps;
      var gl = document.createElementNS(svgns,'line');
      gl.setAttribute('x1',padL); gl.setAttribute('x2',padL+plotW); gl.setAttribute('y1',y); gl.setAttribute('y2',y);
      gl.setAttribute('stroke','rgba(255,255,255,0.06)'); gl.setAttribute('stroke-width','1');
      svg.appendChild(gl);
      var t = document.createElementNS(svgns,'text');
      t.setAttribute('x',padL-8); t.setAttribute('y',y+4); t.setAttribute('text-anchor','end');
      t.setAttribute('font-family','var(--font-mono)'); t.setAttribute('font-size','10'); t.setAttribute('fill','var(--text-dim)');
      t.textContent = val.toFixed(1);
      svg.appendChild(t);
    }

    // line path
    var d = sorted.map(function(l,i){ return (i===0?'M':'L') + xOf(l.date).toFixed(1) + ' ' + yOf(l.weight).toFixed(1); }).join(' ');
    var path = document.createElementNS(svgns,'path');
    path.setAttribute('d',d); path.setAttribute('fill','none'); path.setAttribute('stroke','var(--accent)');
    path.setAttribute('stroke-width','2'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round');
    svg.appendChild(path);

    var tooltip = document.createElement('div');
    tooltip.className = 'chart-tooltip';

    sorted.forEach(function(l,i){
      var cx = xOf(l.date), cy = yOf(l.weight);
      var isLast = i===sorted.length-1;
      var c = document.createElementNS(svgns,'circle');
      c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r', isLast?6:4);
      c.setAttribute('fill', isLast? 'var(--accent)':'var(--bg)');
      c.setAttribute('stroke','var(--accent)'); c.setAttribute('stroke-width','2');
      svg.appendChild(c);
      var hit = document.createElementNS(svgns,'circle');
      hit.setAttribute('cx',cx); hit.setAttribute('cy',cy); hit.setAttribute('r',10); hit.setAttribute('fill','transparent');
      hit.addEventListener('mousemove', function(ev){
        var box = svg.getBoundingClientRect();
        var scale = box.width/W;
        tooltip.style.left = (ev.clientX-box.left)/scale + 12 + 'px';
        tooltip.style.top = (ev.clientY-box.top)/scale - 10 + 'px';
        var g = getGoal(resolvedGoalId[i]);
        tooltip.innerHTML = '<div style="color:var(--text-dim);margin-bottom:2px">'+fmtLong(l.date)+'</div>' +
          '<div>'+l.weight.toFixed(1)+' kg</div>' +
          (g?'<div class="tt-row"><span class="tt-dot" style="background:'+g.color+'"></span>'+esc(g.name)+'</div>':'');
        tooltip.classList.add('show');
      });
      hit.addEventListener('mouseleave', function(){ tooltip.classList.remove('show'); });
      svg.appendChild(hit);
    });

    // x labels: first, last, and up to 3 middle
    var ticks = [sorted[0]];
    if (sorted.length>2) ticks.push(sorted[Math.floor(sorted.length/2)]);
    if (sorted.length>1) ticks.push(sorted[sorted.length-1]);
    ticks.forEach(function(l){
      var lbl = document.createElementNS(svgns,'text');
      lbl.setAttribute('x', xOf(l.date)); lbl.setAttribute('y', H-14);
      lbl.setAttribute('text-anchor','middle'); lbl.setAttribute('font-family','var(--font-mono)');
      lbl.setAttribute('font-size','10'); lbl.setAttribute('fill','var(--text-dim)');
      lbl.textContent = fmtShort(l.date);
      svg.appendChild(lbl);
    });

    var wrap = document.createElement('div');
    wrap.style.position='relative';
    wrap.appendChild(svg); wrap.appendChild(tooltip);

    var legendGoals = Object.keys(usedGoals).map(function(id){ return getGoal(id); }).filter(Boolean);
    var legend = document.createElement('div');
    legend.className='chart-legend';
    legend.innerHTML = legendGoals.map(function(g){
      return '<span class="legend-item"><span class="dot" style="background:'+g.color+';color:'+g.color+'"></span>'+esc(g.name)+'</span>';
    }).join('') || '';

    var outer = document.createElement('div');
    outer.appendChild(wrap);
    if (legendGoals.length) outer.appendChild(legend);
    return outer;
  }

  function resizeImageFile(file, maxDim, cb){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        if (w>h){ if (w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if (h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        var canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        cb(canvas.toDataURL('image/jpeg',0.72));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.addEventListener('submit', function(e){

    if (!form) return;
    e.preventDefault();
    var kind = form.dataset.form;
    var fd = new FormData(form);
    var editingId = fd.get('editingId');

    if (kind==='sync-pin-form'){
      connectPin(fd.get('pin'));
      return;
    }

    if (kind==='entry-form'){
      var entry = { date: fd.get('date'), typeId: fd.get('typeId'), name: (fd.get('name')||'').trim() };
      if (editingId){
        var idx = state.training.entries.findIndex(function(x){return x.id===editingId;});
        state.training.entries[idx] = Object.assign({id:editingId}, entry);
        ui.editingEntryId = null; toast('Entreno actualizado');
      } else {
        entry.id = uid(); state.training.entries.push(entry); toast('Entreno añadido');
      }
      ui.showAddEntry = false;
      persist(); return;
    }

    if (kind==='type-form'){
      var name = (fd.get('name')||'').trim(), color = fd.get('color');
      if (!name) return;
      if (editingId){
        var t = getType(editingId); t.name=name; t.color=color; ui.editingTypeId=null; toast('Tipo actualizado');
      } else {
        state.training.types.push({id:uid(), name:name, color:color}); toast('Tipo añadido');
      }
      persist(); return;
    }

    if (kind==='weight-form'){
      var wlog = { date: fd.get('date'), weight: num(fd.get('weight')) };
      if (editingId){
        var widx = state.nutrition.weightLogs.findIndex(function(x){return x.id===editingId;});
        state.nutrition.weightLogs[widx] = Object.assign({id:editingId}, wlog);
        ui.editingWeightId = null; toast('Registro de peso actualizado');
      } else {
        wlog.id = uid(); state.nutrition.weightLogs.push(wlog); toast('Peso añadido');
      }
      persist(); return;
    }

    if (kind==='goallog-form'){
      var glog = { date: fd.get('date'), goalId: fd.get('goalId')||null };
      if (editingId){
        var gidx = state.nutrition.goalLogs.findIndex(function(x){return x.id===editingId;});
        state.nutrition.goalLogs[gidx] = Object.assign({id:editingId}, glog);
        ui.editingGoalLogId = null; toast('Objetivo actualizado');
      } else {
        glog.id = uid(); state.nutrition.goalLogs.push(glog); toast('Objetivo añadido');
      }
      persist(); return;
    }

    if (kind==='calorielog-form'){
      var clog = { date: fd.get('date'), targetCalories: num(fd.get('targetCalories')) };
      if (editingId){
        var cidx = state.nutrition.calorieLogs.findIndex(function(x){return x.id===editingId;});
        state.nutrition.calorieLogs[cidx] = Object.assign({id:editingId}, clog);
        ui.editingCalorieLogId = null; toast('Calorías objetivo actualizadas');
      } else {
        clog.id = uid(); state.nutrition.calorieLogs.push(clog); toast('Calorías objetivo añadidas');
      }
      persist(); return;
    }

    if (kind==='goal-form'){
      var gname = (fd.get('name')||'').trim(), gcolor = fd.get('color');
      if (!gname) return;
      if (editingId){
        var g = getGoal(editingId); g.name=gname; g.color=gcolor; ui.editingGoalId=null; toast('Objetivo actualizado');
      } else {
        state.nutrition.goals.push({id:uid(), name:gname, color:gcolor}); toast('Objetivo añadido');
      }
      persist(); return;
    }

    if (kind==='ingredient-form'){
      var ing = { name:(fd.get('name')||'').trim() };
      if (!ing.name) return;
      if (editingId){
        var i2 = getIngredient(editingId); Object.assign(i2, ing); ui.editingIngredientId=null; toast('Ingrediente actualizado');
      } else {
        ing.id = uid(); state.nutrition.ingredients.push(ing);
        dishBuilder.items = dishBuilder.items.filter(function(it){return it.ingredientId;});
        dishBuilder.items.push({ingredientId: ing.id, quantity:100, unit:'g'});
        toast('Ingrediente añadido');
      }
      ui.showNewIngredientForm = false;
      persist(); return;
    }
  });

  /* ============================= boot ============================= */
  renderAll();
  renderSyncButton();
  /* Auto-reconnect happens down here, after ui/route/render are all set up —
     connectPin() touches ui.showSyncModal, which doesn't exist yet any earlier
     in the script (that's what was crashing the whole boot sequence before a
     single frame could render). Doing it last also means the page always
     paints the local data instantly, then reconciles with the cloud. */
  if (sb && syncPin) connectPin(syncPin);
  /* Restore the scroll position captured right before the last save, so the
     reload that follows a publish lands back where the user was instead of
     snapping the view to the top. */
  if (ui.mainScrollTop){
    var mainElBoot = document.getElementById('main');
    if (mainElBoot) mainElBoot.scrollTop = ui.mainScrollTop;
  }
})();
</script>
</html>
